<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>숫자 맞히기 (Up & Down)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <h1>Up &amp; Down</h1>
    <p class="desc">컴퓨터가 1~100 사이에 숨긴 숫자를 맞혀보세요. 정답보다 크면 Down, 작으면 Up 힌트를 드려요.</p>

    <div class="info-row">
      <div class="badge" id="attemptsBadge">
        <span class="badge-label">남은 기회</span>
        <span class="badge-value"><span id="attemptsValue">7</span>/7</span>
      </div>
    </div>

    <div class="status" id="status">
      <span id="statusText">숫자를 입력하고 확인을 눌러보세요</span>
    </div>

    <form id="guessForm" class="guess-form" novalidate>
      <input
        type="text"
        id="guessInput"
        inputmode="numeric"
        placeholder="1~100"
        autocomplete="off"
      >
      <button type="submit" id="submitBtn">확인</button>
    </form>

    <div class="result hidden" id="result">
      <p class="result-text" id="resultText"></p>
      <button id="restartBtn" class="restart-btn">다시하기</button>
    </div>
  </main>

<script src="script.js"></script>
</body>
</html>
